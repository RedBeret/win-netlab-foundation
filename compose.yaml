services:
  synthetic-health:
    build:
      context: ./docker/training-service
    container_name: win-netlab-foundation-synthetic-health
    ports:
      - "8088:8080"
    environment:
      LAB_NAME: win-netlab-foundation
      LAB_HOSTNAME: health-a.lab.example
      LAB_IP: 192.0.2.44
      LAB_SERIAL: FTX0000HEALTH01
      LAB_OPERATOR: lab-operator
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"

