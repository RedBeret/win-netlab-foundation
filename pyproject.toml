[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "win-netlab-foundation"
version = "0.1.0"
description = "Windows-first synthetic training repo for local network automation study."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "RedBeret" }
]
keywords = ["windows", "wsl", "docker", "powershell", "network-automation", "training"]
optional-dependencies = { dev = ["pytest>=8.0.0", "pydantic>=2.7.0", "typer>=0.12.0"] }

[project.scripts]
win-netlab = "win_netlab_foundation.cli:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]
